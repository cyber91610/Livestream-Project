name: Daily YouTube Stream from GDrive
on:
  schedule:
    - cron: '2 0 * * *'
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pipx install gdown

      - name: Download Video from Google Drive
        run: gdown "https://drive.google.com/file/d/1IbBKJddGDcG3jMAM2Ey9ik5AAhGKcUel/view?usp=drivesdk" -O video.mp4

      - name: Stream to YouTube
        run: |
          ffmpeg -re -i video.mp4 -c copy -f flv rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}
